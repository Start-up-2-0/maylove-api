name: Deploy Staging

on:
  push:
    branches: [staging]

concurrency:
  group: railway-staging-${{ github.repository }}
  cancel-in-progress: true

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy API web (staging)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
        run: railway up --detach --ci

  deploy-worker:
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    needs: deploy-web
    if: vars.RAILWAY_WORKER_SERVICE_ID_STAGING != ''
    steps:
      - uses: actions/checkout@v4

      - name: Deploy API worker (staging)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
        run: railway up --detach --ci --service "${{ vars.RAILWAY_WORKER_SERVICE_ID_STAGING }}"
