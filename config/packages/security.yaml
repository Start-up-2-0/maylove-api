security:
    password_hashers:
        App\Infrastructure\Persistence\Entity\User:
            algorithm: auto

    providers:
        maylove_users:
            id: App\Infrastructure\Security\MayLoveUserProvider

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        api:
            pattern: ^/api
            stateless: true
            provider: maylove_users
            custom_authenticators:
                - App\Infrastructure\Security\MayLoveTokenAuthenticator
            entry_point: App\Infrastructure\Security\MayLoveTokenAuthenticator

    access_control:
        - { path: ^/api/v1/health, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/auth/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/auth/refresh, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/auth/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/auth/verify-email, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/tribute-types, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/templates, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/billing/product, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/music-tracks, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/public/tributes, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            App\Infrastructure\Persistence\Entity\User:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
