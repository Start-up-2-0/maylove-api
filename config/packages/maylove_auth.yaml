parameters:
    auth.token_salt: '%env(AUTH_TOKEN_SALT)%'
    auth.token_header_name: '%env(AUTH_TOKEN_HEADER_NAME)%'
    auth.session_minutes: '%env(int:AUTH_SESSION_MINUTES)%'
    auth.refresh_token_days: '%env(int:AUTH_REFRESH_TOKEN_DAYS)%'
    auth.sliding_renewal_minutes: '%env(int:AUTH_SLIDING_RENEWAL_MINUTES)%'
    auth.max_login_attempts: '%env(int:AUTH_MAX_LOGIN_ATTEMPTS)%'
    auth.lockout_minutes: '%env(int:AUTH_LOCKOUT_MINUTES)%'
    auth.validate_ip_on_token: '%env(bool:default:auth_validate_ip_default:AUTH_VALIDATE_IP_ON_TOKEN)%'
    auth.validate_user_agent_on_token: '%env(bool:default:auth_validate_ua_default:AUTH_VALIDATE_USER_AGENT_ON_TOKEN)%'
    auth_validate_ip_default: '1'
    auth_validate_ua_default: '1'
    auth_cookie_secure_default: '0'
    auth.cookie_secure: '%env(bool:default:auth_cookie_secure_default:AUTH_COOKIE_SECURE)%'
    auth_email_verification_enabled_default: '1'
    auth.email_verification_enabled: '%env(bool:default:auth_email_verification_enabled_default:AUTH_EMAIL_VERIFICATION_ENABLED)%'
    auth.email_verification_hours: '%env(int:AUTH_EMAIL_VERIFICATION_HOURS)%'
    auth.email_resend_max_per_hour: 3
