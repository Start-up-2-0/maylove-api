nelmio_cors:
    defaults:
        # origin_regex: true permite usar regex em CORS_ALLOW_ORIGIN.
        # PRODUÇÃO: defina CORS_ALLOW_ORIGIN como regex do domínio exato do frontend.
        # Exemplo: ^https://maylov\.com$
        # DESENVOLVIMENTO: ^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$
        #
        # ATENÇÃO: allow_credentials: true + origin aberta (.*) permite que
        # qualquer site faça requisições autenticadas em nome do usuário (CSRF).
        origin_regex: true
        allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
        allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
        allow_headers: ['Content-Type', 'Authorization', 'x-maylove-token']
        expose_headers: ['Link', 'x-maylove-token']
        allow_credentials: true
        max_age: 3600
    paths:
        '^/': null
