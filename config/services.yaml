parameters:

    # Fallback quando TRUSTED_PROXIES não estiver definido no ambiente.
    trusted_proxies_default: '127.0.0.1'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Kernel.php'
            - '../src/Infrastructure/Security/MayLoveUser.php'

    App\Infrastructure\Storage\StorageApiClient:
        arguments:
            $storageApiUrl: '%storage.api_url%'

    App\Application\Music\MusicTrackUrlResolver:
        arguments:
            $storagePublicUrl: '%storage.public_url%'

    App\Infrastructure\Payment\MercadoPagoClient:
        arguments:
            $accessToken: '%mercadopago.access_token%'
            $apiBaseUrl: '%mercadopago.api_base%'

    App\Infrastructure\Payment\MercadoPagoWebhookSignatureValidator:
        arguments:
            $webhookSecret: '%mercadopago.webhook_secret%'

    App\Application\Billing\SubscriptionCapabilityService:
        arguments:
            $billingEnabled: '%billing.enabled%'

    App\Application\Billing\SubscriptionService:
        arguments:
            $frontendUrl: '%app.url%'
            $notificationUrl: '%mercadopago.notification_url%'
            $billingEnabled: '%billing.enabled%'

    App\Application\Billing\OrderCheckoutService:
        arguments:
            $notificationUrl: '%mercadopago.notification_url%'

    App\UI\Http\Controller\Web\MercadoPagoWebhookController:
        arguments:
            $webhookSignatureRequired: '%mercadopago.webhook_signature_required%'

    App\Infrastructure\Security\HmacTokenCodec:
        arguments:
            $secret: '%storage.service_token_secret%'

    App\Infrastructure\Security\MayLoveServiceTokenService:
        arguments:
            $ttlSeconds: 300

    App\Infrastructure\Security\MayLoveTokenService:
        arguments:
            $tokenSalt: '%auth.token_salt%'
            $sessionMinutes: '%auth.session_minutes%'
            $refreshTokenDays: '%auth.refresh_token_days%'

    App\Application\Auth\AuthSessionService:
        arguments:
            $maxLoginAttempts: '%auth.max_login_attempts%'
            $validateIpOnToken: '%auth.validate_ip_on_token%'
            $validateUserAgentOnToken: '%auth.validate_user_agent_on_token%'

    App\Application\Auth\AuthService:
        arguments:
            $maxLoginAttempts: '%auth.max_login_attempts%'
            $lockoutMinutes: '%auth.lockout_minutes%'
            $emailVerificationEnabled: '%auth.email_verification_enabled%'

    App\Application\User\RegisterUserService:
        arguments:
            $emailVerificationEnabled: '%auth.email_verification_enabled%'

    App\Application\Tribute\TributeService:
        arguments:
            $emailVerificationEnabled: '%auth.email_verification_enabled%'

    App\Application\Album\AlbumService:
        arguments:
            $emailVerificationEnabled: '%auth.email_verification_enabled%'

    App\Infrastructure\Security\MayLoveTokenAuthenticator:
        arguments:
            $tokenHeaderName: '%auth.token_header_name%'
            $slidingRenewalMinutes: '%auth.sliding_renewal_minutes%'

    App\UI\Http\Controller\AuthController:
        arguments:
            $cookieSecure: '%auth.cookie_secure%'
            $tokenHeaderName: '%auth.token_header_name%'

    App\UI\Http\EventSubscriber\ApiExceptionSubscriber:
        arguments:
            $exposeErrors: '%app.expose_errors%'

    App\Infrastructure\Email\ResendEmailGateway:
        arguments:
            $enabled: '%mail.enabled%'
            $from: '%mail.from%'

    App\Application\User\EmailVerificationService:
        arguments:
            $frontendUrl: '%mail.frontend_url%'
            $verificationHours: '%auth.email_verification_hours%'
            $emailVerificationEnabled: '%auth.email_verification_enabled%'

    App\Application\User\VerificationResendRateLimitService:
        arguments:
            $maxPerHour: '%auth.email_resend_max_per_hour%'

    App\Application\Tribute\TributeCheckoutService:
        arguments:
            $billingEnabled: '%billing.enabled%'

    App\Application\Tribute\TributePublishService:
        arguments:
            $billingEnabled: '%billing.enabled%'

    App\Application\Album\AlbumCheckoutService:
        arguments:
            $billingEnabled: '%billing.enabled%'

    App\Application\Album\AlbumPublishService:
        arguments:
            $billingEnabled: '%billing.enabled%'

    App\UI\Http\Controller\Web\PublicTributePageController:
        arguments:
            $frontendUrl: '%app.url%'

    App\Application\Tribute\TributePublishedDispatcher:
        arguments:
            $appUrl: '%app.url%'

    App\Application\Album\AlbumChapterService: ~
    App\Application\Album\AlbumMemoryService: ~
    App\Application\Album\AlbumExperienceService: ~
    App\Application\Album\AlbumTimelineService: ~
    App\Application\Album\AlbumChapterSerializer: ~
    App\Application\Album\AlbumMemorySerializer: ~
    App\Application\Album\AlbumExperienceSerializer: ~
    App\Application\Album\AlbumQrService:
        arguments:
            $appUrl: '%app.url%'
